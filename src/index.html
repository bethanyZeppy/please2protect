<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Please2Protect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css" />

    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="main-container">

        <!-- Top bar -->
        <div class="top-container">
          <button><i class="fas fa-bars"></i></button>
          <button><i class="fas fa-bars"></i></button>
          <button><i class="fas fa-bars"></i></button>
        </div>

        <!-- Main content -->
        <div class="main-container-contents">

          <!-- Left sidebar -->
          <div class="main-container-left-content">
            <div class="active-chats"></div>

            <div class="chat-buttons">
              <button><i class="fas fa-face-smile"></i></button>
              <button><i class="fas fa-thumbs-up"></i></button>
            </div>
          </div>

          <!-- Central chat area -->
          <div class="central-info-page">
            <h1>USER</h1>

            <div id="messages-container" class="messages-container">
              <p id="message"></p>
            </div>

            <form id="input-form" class="input-form">
              <button id="send-file-btn" type="button"><i class="fas fa-file"></i></button>
              <input id="input" class="input" placeholder="..." />
              <button id="send-message-btn" type="submit"><i class="fas fa-paper-plane"></i></button>
            </form>
          </div>

        </div>
      </div>

      <!-- Right sidebar -->
      <div id="contact-container" class="contact-container"></div>
    </main>
  </body>
</html>
