<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Please2Protect</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div id="main-container" class="main-container">
        <div id="top-button-container" class="top-button-container">
          <button>
            <i class="fas fa-bars"></i>
          </button>
          <button>
            <i class="fas fa-bars"></i>
          </button>
          <button>
            <i class="fas fa-bars"></i>
          </button>
        </div>
        
        <div id="main-container-contents" class="main-container-contents">
          <div id="main-container-left-content" class="main-container-left-content">
            <div id="active-chats" class="active-chats">
            </div>

            <div id="chat-buttons" class="chat-buttons">
              <button>
                <i class="fas fa-face-smile"></i>
              </button>
              <button>
                <i class="fas fa-thumbs-up"></i>
              </button>
            </div>
          </div>

          <div id="central-info-page" class="central-info-page">
            <h1>USER</h1>
            <div id="messages-container" class="messages-container">
              <p id="message"></p>
            </div>
            <form id="input-form" class="input-form">
              <button id="send_file_btn">
                <i class="fas fa-file"></i>
              </button>
              <input id="input" class="input" placeholder="..." />
              <button id="send_message_btn">
                <i class="fas fa-paper-plane"></i>
              </button>
            </form>
          </div>

        </div>
      </div>


      <div id="contact-container" class="contact-container">
      
      </div>

    </main>
  </body>
</html>
